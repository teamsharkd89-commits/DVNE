name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and write keystore.properties
        run: |
          echo "${{ secrets.DVNE_KEYSTORE_BASE64 }}" | base64 -d > dvne-release.keystore
          cat > keystore.properties <<EOF
          storeFile=dvne-release.keystore
          storePassword=${{ secrets.DVNE_STORE_PASSWORD }}
          keyAlias=${{ secrets.DVNE_KEY_ALIAS }}
          keyPassword=${{ secrets.DVNE_KEY_PASSWORD }}
          EOF

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName =' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Prepare artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk DVNE.apk
          sha256sum DVNE.apk > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DVNE ${{ steps.version.outputs.version }}
          files: |
            DVNE.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
